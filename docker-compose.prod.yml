services:
  mongo:
    image: mongo:7
    container_name: portfolio-prod-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  app:
    image: richef07/porfoliocherif:latest
    container_name: portfolio-prod-app
    restart: unless-stopped
    ports:
      - "8081:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/fullstack_portfolio
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_prod_data:
