apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
  namespace: portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-app
  template:
    metadata:
      labels:
        app: portfolio-app
    spec:
      containers:
        - name: portfolio-app
          image: richef07/porfoliocherif:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/fullstack_portfolio"
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-app
  namespace: portfolio
spec:
  type: NodePort
  selector:
    app: portfolio-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
